# IAM 服务配置模板；密钥仅从部署环境注入，IAM与资源服务使用同一专用值。
ingot:
  iam:
    resource-rpc:
      registrations:
        - service-name: iam-ops
          secret: ${IAM_OPS_RESOURCE_RPC_SECRET}
          descriptor:
            key: {domain: PLATFORM, application-code: iam-ops, resource-code: incident}
            read-action: iam-ops:incident:read
            hierarchical: false
            actions:
              - {code: 'iam-ops:incident:read', mode: READ_ONLY}
              - {code: 'iam-ops:incident:update', mode: MUTATING}
              - {code: 'iam-ops:incident:export', mode: READ_ONLY}
            scope-capabilities: [ALL, SELF, OBJECT_SET]
            fields:
              - {key: title, label: 标题, visibilities: [HIDDEN, MASKED, FULL], editable: true, filterable: true, sortable: false}
              - {key: contact, label: 联系方式, visibilities: [HIDDEN, MASKED, FULL], editable: true, filterable: false, sortable: false}
            defaults:
              title: {visibility: FULL, editable: true}
              contact: {visibility: MASKED, editable: false}
spring:
  cloud:
    openfeign:
      client:
        config:
          iam-ops: {connectTimeout: 1500, readTimeout: 3000}
---
# 资源服务配置模板（单独文件/配置中心；不是与上段合并的同一应用配置）。
ingot:
  iam:
    resource-rpc:
      secret: ${IAM_OPS_RESOURCE_RPC_SECRET}
    authorization:
      ttl: 30s
      maximum-size: 1000
      l1-enabled: true
      l2-enabled: true
spring:
  cloud:
    openfeign:
      client:
        config:
          in-service-iam: {connectTimeout: 1500, readTimeout: 3000}
