image: docker:20.10.9

variables:
  DEV_VERSION: ${CI_COMMIT_SHORT_SHA}
  # nexus
  INGOT_NEXUS_URL: ${CI_INGOT_NEXUS_URL}
  INGOT_NEXUS_USERNAME: ${CI_INGOT_NEXUS_USERNAME}
  INGOT_NEXUS_PASSWORD: ${CI_INGOT_NEXUS_PASSWORD}
  # 中间件Host配置
  MYSQL_HOST: 172.88.0.10
  NACOS_HOST: 172.88.0.20
  NACOS_PORT: 8848
  REDIS_HOST: 172.88.0.90
  # Ingot Host配置
  SERVICE_AUTH_HOST: 172.88.0.110
  SERVICE_GATEWAY_HOST: 172.88.0.100
  # 账号配置
  MYSQL_USERNAME: ${CI_INGOT_MYSQL_USERNAME}
  MYSQL_PASSWORD: ${CI_INGOT_MYSQL_PASSWORD}
  REDIS_PASSWORD: ${CI_INGOT_REDIS_PASSWORD}
  # auth
  AUTH_MODULE_NAME: ingot-auth
  AUTH_VERSION: 0.1.0
  # iam
  IAM_MODULE_NAME: ingot-iam
  IAM_VERSION: 0.1.0
  IAM_IMAGE_NAME: docker-registry.ingotcloud.top/ingot/iam
  # gateway
  GATEWAY_MODULE_NAME: ingot-gateway
  GATEWAY_VERSION: 0.1.0

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - output/

stages:
  - assemble
  - docker-build
  - deploy

.docker-build:
  script:
    - cd ./output/${MODULE_NAME}/${INNER_VERSION}
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" docker-registry.wangchao.im
    - docker build -t docker-registry.wangchao.im/ingot/${MODULE_NAME}:${INNER_VERSION} .
    - docker push docker-registry.wangchao.im/ingot/${MODULE_NAME}:${INNER_VERSION}

auth-assemble:
  stage: assemble
  image: gradle:7.2-jdk8
  script:
    - gradle -PINGOT_NEXUS_URL=${INGOT_NEXUS_URL}
      -PINGOT_NEXUS_USERNAME=${INGOT_NEXUS_USERNAME}
      -PINGOT_NEXUS_PASSWORD=${INGOT_NEXUS_PASSWORD}
      -PJY_DOCKER_REGISTRY_USERNAME=${JY_DOCKER_REGISTRY_USERNAME}
      -PJY_DOCKER_REGISTRY_PASSWORD=${JY_DOCKER_REGISTRY_PASSWORD}
      :ingot-service:ingot-auth:ingot-auth-provider:ingotAssemble
    - gradle :ingot-service:ingot-auth:ingot-auth-provider:shiftDockerfileIngotAuth
  when: manual
  tags: [ingot]

iam-assemble:
  stage: assemble
  cache: []
  artifacts:
    paths:
      - output/ingot-iam-provider/
    expire_in: 1 day
  image: gradle:8.12.1-jdk21
  script:
    - gradle -PINGOT_NEXUS_URL=${INGOT_NEXUS_URL}
      -PINGOT_NEXUS_USERNAME=${INGOT_NEXUS_USERNAME}
      -PINGOT_NEXUS_PASSWORD=${INGOT_NEXUS_PASSWORD}
      -PJY_DOCKER_REGISTRY_USERNAME=${JY_DOCKER_REGISTRY_USERNAME}
      -PJY_DOCKER_REGISTRY_PASSWORD=${JY_DOCKER_REGISTRY_PASSWORD}
      :ingot-service:ingot-iam:ingot-iam-provider:ingotAssemble
    - gradle :ingot-service:ingot-iam:ingot-iam-provider:shiftDockerfileProd
  when: manual
  tags: [ingot]

gateway-assemble:
  stage: assemble
  image: gradle:7.2-jdk8
  script:
    - gradle -PINGOT_NEXUS_URL=${INGOT_NEXUS_URL}
      -PINGOT_NEXUS_USERNAME=${INGOT_NEXUS_USERNAME}
      -PINGOT_NEXUS_PASSWORD=${INGOT_NEXUS_PASSWORD}
      -PJY_DOCKER_REGISTRY_USERNAME=${JY_DOCKER_REGISTRY_USERNAME}
      -PJY_DOCKER_REGISTRY_PASSWORD=${JY_DOCKER_REGISTRY_PASSWORD}
      :ingot-service:ingot-gateway:ingotAssemble
    - gradle :ingot-service:ingot-gateway:shiftDockerfileIngotAuth
  when: manual
  tags: [ingot]

auth-docker-build:
  stage: docker-build
  extends: .docker-build
  variables:
    MODULE_NAME: ${AUTH_MODULE_NAME}
    INNER_VERSION: ${AUTH_VERSION}
  tags: [ingot]
  when: manual
  only:
    - main

iam-docker-build:
  stage: docker-build
  cache: []
  needs:
    - job: iam-assemble
      artifacts: true
  variables:
    MODULE_NAME: ${IAM_MODULE_NAME}
    INNER_VERSION: ${IAM_VERSION}
  script:
    - cd ./output/ingot-iam-provider
    - echo "${CI_REGISTRY_PASSWORD}" | docker login --username "${CI_REGISTRY_USER}" --password-stdin docker-registry.ingotcloud.top
    - docker build -t ${IAM_IMAGE_NAME}:${INNER_VERSION} .
    - docker push ${IAM_IMAGE_NAME}:${INNER_VERSION}
  tags: [ingot]
  when: manual
  only:
    - main

gateway-docker-build:
  stage: docker-build
  extends: .docker-build
  variables:
    MODULE_NAME: ${GATEWAY_MODULE_NAME}
    INNER_VERSION: ${GATEWAY_VERSION}
  tags: [ingot]
  when: manual
  only:
    - main

auth-docker-run:
  stage: deploy
  variables:
    MODULE_NAME: ${AUTH_MODULE_NAME}
    INNER_VERSION: ${AUTH_VERSION}
    SERVICE_NAME: ${MODULE_NAME}-${INNER_VERSION}
    IMAGE_NAME: docker-registry.wangchao.im/ingot/${MODULE_NAME}:${INNER_VERSION}
  script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" docker-registry.wangchao.im
    - docker ps -q --filter name="${SERVICE_NAME}" | xargs -r docker rm -f
    - docker images -q --filter reference="${IMAGE_NAME}" | xargs -r docker rmi -f
    - docker pull ${IMAGE_NAME}
    - docker run -d --name ${SERVICE_NAME} --restart always
      --network ingot-net --ip ${SERVICE_AUTH_HOST}
      --add-host ingot-db-redis:${REDIS_HOST}
      --add-host ingot-db-mysql:${MYSQL_HOST}
      --add-host ingot-auth-server:${SERVICE_AUTH_HOST}
      --add-host ingot-gateway:${SERVICE_GATEWAY_HOST}
      -e NACOS_HOST=${NACOS_HOST}
      -e NACOS_PORT=${NACOS_PORT}
      -e REDIS_HOST=${REDIS_HOST}
      -e MYSQL_HOST=${MYSQL_HOST}
      -e MYSQL_USERNAME=${MYSQL_USERNAME}
      -e MYSQL_PASSWORD=${MYSQL_PASSWORD}
      -e REDIS_PASSWORD=${REDIS_PASSWORD}
      -v /ingot-data:/ingot-data
      ${IMAGE_NAME}
  tags: [ingot]
  when: manual
  only:
    - main

iam-docker-run:
  stage: deploy
  cache: []
  needs:
    - job: iam-docker-build
  variables:
    MODULE_NAME: ${IAM_MODULE_NAME}
    INNER_VERSION: ${IAM_VERSION}
    SERVICE_NAME: ${MODULE_NAME}-${INNER_VERSION}
    IMAGE_NAME: ${IAM_IMAGE_NAME}:${INNER_VERSION}
  script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login --username "${CI_REGISTRY_USER}" --password-stdin docker-registry.ingotcloud.top
    - docker ps -q --filter name="${SERVICE_NAME}" | xargs -r docker rm -f
    - docker images -q --filter reference="${IMAGE_NAME}" | xargs -r docker rmi -f
    - docker pull ${IMAGE_NAME}
    - docker run -d --name ${SERVICE_NAME} --restart always
      --network ingot-net
      --add-host ingot-db-redis:${REDIS_HOST}
      --add-host ingot-db-mysql:${MYSQL_HOST}
      --add-host ingot-auth-server:${SERVICE_AUTH_HOST}
      --add-host ingot-gateway:${SERVICE_GATEWAY_HOST}
      -e IAM_DATABASE=${IAM_DATABASE:?Set IAM_DATABASE to the verified IAM target database}
      -e NACOS_HOST=${NACOS_HOST}
      -e NACOS_PORT=${NACOS_PORT}
      -e REDIS_HOST=${REDIS_HOST}
      -e MYSQL_HOST=${MYSQL_HOST}
      -e MYSQL_USERNAME=${MYSQL_USERNAME}
      -e MYSQL_PASSWORD=${MYSQL_PASSWORD}
      -e REDIS_PASSWORD=${REDIS_PASSWORD}
      -v /ingot-data:/ingot-data
      ${IMAGE_NAME}
  tags: [ingot]
  when: manual
  only:
    - main

gateway-docker-run:
  stage: deploy
  variables:
    MODULE_NAME: ${AUTH_MODULE_NAME}
    INNER_VERSION: ${AUTH_VERSION}
    SERVICE_NAME: ${MODULE_NAME}-${INNER_VERSION}
    IMAGE_NAME: docker-registry.wangchao.im/ingot/${MODULE_NAME}:${INNER_VERSION}
  script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" docker-registry.wangchao.im
    - docker ps -q --filter name="${SERVICE_NAME}" | xargs -r docker rm -f
    - docker images -q --filter reference="${IMAGE_NAME}" | xargs -r docker rmi -f
    - docker pull ${IMAGE_NAME}
    - docker run -d --name ${SERVICE_NAME} --restart always
      --network ingot-net --ip ${SERVICE_GATEWAY_HOST}
      --add-host ingot-db-redis:${REDIS_HOST}
      --add-host ingot-db-mysql:${MYSQL_HOST}
      --add-host ingot-auth-server:${SERVICE_AUTH_HOST}
      --add-host ingot-gateway:${SERVICE_GATEWAY_HOST}
      -e NACOS_HOST=${NACOS_HOST}
      -e NACOS_PORT=${NACOS_PORT}
      -e REDIS_HOST=${REDIS_HOST}
      -e MYSQL_HOST=${MYSQL_HOST}
      -e MYSQL_USERNAME=${MYSQL_USERNAME}
      -e MYSQL_PASSWORD=${MYSQL_PASSWORD}
      -e REDIS_PASSWORD=${REDIS_PASSWORD}
      -v /ingot-data:/ingot-data
      ${IMAGE_NAME}
  tags: [ingot]
  when: manual
  only:
    - main