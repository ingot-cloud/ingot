apply from: "${project.getRootDir().path}/config/library-base.gradle"

dependencies {
    implementation project(ingot.framework_commons)

    compileOnly(deps.jakarta_servlet_api)
    compileOnly(deps.spring.framework_spring_web)
    compileOnly(deps.spring.framework_jdbc)
    runtimeOnly("com.twelvemonkeys.imageio:imageio-webp:3.15.3")

    testImplementation(deps.spring.spring_boot.test)
    testImplementation(deps.jakarta_servlet_api)
}

test {
    useJUnitPlatform()
}
