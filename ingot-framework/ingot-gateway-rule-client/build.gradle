apply from: "${project.getRootDir().path}/config/library-base.gradle"

dependencies {
    api project(ingot.framework_cache)
    api project(ingot.framework_event_bus)
    api project(ingot.security_api)

    implementation project(ingot.framework_commons)
    implementation(deps.spring.spring_boot.spring_boot_autoconfigure)
    implementation(deps.spring.framework_context)
    implementation(deps.caffeine)

    compileOnly(deps.spring.spring_cloud.openfeign_starter)
    compileOnly(deps.spring.spring_cloud.context)
    compileOnly(deps.spring.spring_boot.data_redis_starter)
    compileOnly(deps.jackson.annotation)
    compileOnly(deps.jackson.data_bind)
    compileOnly(deps.spring.spring_boot.actuator_autoconfigure)

    testImplementation(deps.spring.spring_boot.test)
    testImplementation(deps.spring.spring_cloud.context)
    testImplementation(deps.spring.spring_boot.data_redis_starter)
    testImplementation(deps.spring.framework_spring_web)
}

test {
    useJUnitPlatform()
}
