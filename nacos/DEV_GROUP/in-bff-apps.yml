# 仅 Gateway 与 BFF 加载。不要放入 in-common.yml。
# 本机 DEV 仅两个同源宿主，各自 /login/ 与管理页共用端口。
# *.localhost 由浏览器直接回环，不必写 /etc/hosts，也没有 .local 的 mDNS 延迟。
# 改完后把本文件同步到 Nacos DEV_GROUP，并重启/刷新 Gateway 与 BFF。
# oauth-redirect-uri 是 Auth 协议回调（网关地址），浏览器不会跳转过去。
ingot:
  bff:
    require-https: false
    apps:
      - app-id: platform-admin
        domain: PLATFORM
        origin: http://platform.localhost:5799
        oauth-client-id: in-bff-platform
        oauth-scope: system
        oauth-redirect-uri: http://localhost:5400/bff/auth/platform/callback
        default-return-to: /
      - app-id: tenant-admin
        domain: TENANT
        origin: http://tenant.localhost:5798
        oauth-client-id: in-bff-tenant
        oauth-scope: system
        oauth-redirect-uri: http://localhost:5400/bff/auth/tenant/callback
        default-return-to: /
