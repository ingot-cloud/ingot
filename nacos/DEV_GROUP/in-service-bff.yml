ingot:
  security:
    oauth2:
      resource:
        public-urls:
          - /crypto/public-keys,GET
    # 账号锁定 BFF 登录短路：解密后查 Redis name key；默认拦截不调 Auth
    account:
      bff:
        # 是否在登录解密后检查 Redis name key，默认开启。
        enabled: true
        # BFF 拦截时是否仍调 Auth 以产生 LOGIN_FAILURE；默认关闭。
        emit-login-failure-on-bff-block: false
  bff:
    # 管理用户:0, C端用户:1
    user-type: "0"
    session-ttl: 7200
    transaction-ttl: 600
    ticket-ttl: 60
    security:
      # 客户端指纹校验，防止 Cookie 盗用
      fingerprint-enabled: ${BFF_FINGERPRINT_ENABLED:true}
      # 指纹模式: device（前端设备指纹，推荐）/ ip_ua（服务端 IP+UA，降级方案）
      fingerprint-mode: ${BFF_FINGERPRINT_MODE:device}

# SpringDoc/Swagger配置（开发环境开启）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha

# ==================== 日志配置 ====================
logs:
  path: ${LOG_PATH:/ingot-data/logs}

# 开发环境日志级别配置
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.cloud: DEBUG
    com.alibaba.nacos.client: INFO
    com.alibaba.cloud: INFO
    com.ingot: DEBUG
  logback:
    rollingpolicy:
      max-file-size: ${LOG_FILE_MAX_SIZE:100MB}
      max-history: ${LOG_FILE_MAX_HISTORY:30}
      total-size-cap: ${LOG_FILE_TOTAL_SIZE:20GB}