spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: openapi
              uri: lb://in-service-gateway
              predicates:
                - Path=/v3/api-docs/**
              filters:
                - RewritePath=/v3/api-docs/(?<path>.*), /$\{path}/$\{path}/v3/api-docs
            - id: in-service-iam
              uri: lb://in-service-iam
              predicates:
                - Path=/iam/**
              filters:
                - StripPrefix=1
            - id: in-service-member
              uri: lb://in-service-member
              predicates:
                - Path=/member/**
              filters:
                - StripPrefix=1
            - id: in-service-security
              uri: lb://in-service-security
              predicates:
                - Path=/security/**
              filters:
                - StripPrefix=1
            - id: in-crypto-pubkey
              uri: lb://in-service-bff
              predicates:
                - Path=/crypto/public-keys
            - id: in-service-bff
              uri: lb://in-service-bff
              predicates:
                - Path=/bff/**
            - id: in-service-auth
              uri: lb://in-service-auth
              predicates:
                - Path=/auth/client/**,/auth/token/**
              filters:
                - StripPrefix=1

ingot:
  vc:
    verifyUrls: []
    image:
      opsLimitGetPerMinute: 20
      opsLimitCheckPerMinute: 40
  security:
    account:
      gateway:
        # 是否启用账号锁定 AccountLockFilter，默认开启
        enabled: true
        # 不检查锁定状态的路径 Ant 模式。
        excludePathPatterns:
          - /actuator/**
          - /bff/auth/**
    policy:
      # GatewayRuleClientProperties
      client:
        # 跨节点失效订阅开关
        invalidation-enabled: true
        # 是否启用 remote → LKG → Nacos 地板 弹性降级链
        resilience-enabled: true
        # remote 不可用且 LKG 为空时，是否回落到 Nacos 地板配置
        local-floor-enabled: true
        # 共享快照的分层缓存参数。
        cache:
          # 1级缓存存活时间
          l1-ttl: 5m
          # 2级缓存存活时间
          l2-ttl: 30m
    # 限流域开关与来源；groups/rules 地板在 in-security-gateway.yml
    ratelimit:
      enabled: true
      policy:
        mode: local
    # 黑白名单开关与来源；items 地板在 in-security-gateway.yml
    blacklist:
      enabled: false
      policy:
        mode: local
    # 限流违规升级开关与来源；阈值地板在 in-security-gateway.yml
    violation-escalation:
      enabled: true
      policy:
        mode: local
    # 挑战验证开关与来源；groups/policies 地板在 in-security-gateway.yml
    challenge:
      enabled: true
      policy:
        mode: local
    # 事件配置
    event:
      # 总开关；Gateway 仅在上报 ACCESS 类事件时依赖此项。
      enabled: true
      # center：经 Feign 上报 ingot-security admission；不写网关本地 security_event 表。
      target: center
      # Gateway 稳定态不需要 shadow；留空 []。
      shadow-targets: []
      # 写入中心 security_event.source_module。
      source-module: GATEWAY
      # Gateway 通常只产生 ACCESS 类事件；其余类别关闭可减少无效配置。
      categories:
        auth: false
        account: false
        credential: false
        access: true
      # target=center 时 BEST_EFFORT 仍走 memory 缓冲后再 Feign 批量上报。
      delivery:
        memory:
          queue-capacity: 2048
          batch-size: 32
          poll-timeout-ms: 100
          shutdown-timeout-ms: 5000
        # DURABLE 事件（如 BLACKLIST_BLOCK）仍需要 spool；未显式配置时使用下方 Java 默认值：
        # spool.directory 为父目录，运行时再拼 spring.application.name。
      # Gateway 不写本地 canonical 表，通常不需要 retention；中心库由 in-service-security 清理。
      retention:
        enabled: false

# SpringDoc/Swagger配置（生产环境关闭）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ==================== 日志配置 ====================
logs:
  path: ${LOG_PATH:/ingot-data/logs}

# 生产环境日志级别配置
logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    org.springframework.web: ${LOG_LEVEL_WEB:WARN}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.springframework.cloud: ${LOG_LEVEL_CLOUD:WARN}
    com.alibaba.nacos.client: ${LOG_LEVEL_NACOS:ERROR}
    com.alibaba.cloud: ${LOG_LEVEL_ALIBABA_CLOUD:WARN}
    com.ingot: ${LOG_LEVEL_APP:INFO}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_FILE_MAX_SIZE:100MB}
      max-history: ${LOG_FILE_MAX_HISTORY:30}
      total-size-cap: ${LOG_FILE_TOTAL_SIZE:20GB}