# 仅 Gateway 与 BFF 加载。不要放入 in-common.yml。
# 内网生产不要复用公网域名，应覆盖为本环境两个 HTTPS origin（支持同一 IP 的 8443/9443 双端口）。
ingot:
  bff:
    require-https: true
    apps:
      - app-id: platform-admin
        domain: PLATFORM
        origin: https://platform.ingotcloud.top
        oauth-client-id: in-bff-platform
        oauth-scope: system
        oauth-redirect-uri: https://bff.ingotcloud.top/bff/auth/platform/callback
        default-return-to: /
      - app-id: tenant-admin
        domain: TENANT
        origin: https://admin.ingotcloud.top
        oauth-client-id: in-bff-tenant
        oauth-scope: system
        oauth-redirect-uri: https://bff.ingotcloud.top/bff/auth/tenant/callback
        default-return-to: /
