spring:
  datasource:
    # 数据库连接URL配置
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ingot_core}?useUnicode=true&characterEncoding=UTF8&useSSL=${MYSQL_SSL:false}&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=${MYSQL_PREP_STMT_CACHE_SIZE:250}&prepStmtCacheSqlLimit=${MYSQL_PREP_STMT_SQL_LIMIT:2048}&cacheResultSetMetadata=true&cacheServerConfiguration=true&maintainTimeStats=false&useLocalSessionState=true&elideSetAutoCommits=true&socketTimeout=${MYSQL_SOCKET_TIMEOUT:30000}&connectTimeout=${MYSQL_CONNECT_TIMEOUT:10000}

# Ingot业务配置
ingot:
  security:
    event:
      # 安全事件总开关；false 时不做任何上报
      enabled: true
      # 投递目标：local=本库 security_event，center=上报 ingot-security
      target: local
      # target=local 时指定主 Store，典型值 mysql
      primary-store: mysql
      # 迁移 shadow；稳定态留空
      shadow-targets: []
      # 写入 security_event.source_module
      sourceModule: PMS
      # 按事件大类过滤（enabled=true 时生效）
      categories:
        # 认证类：登录成功/失败等（AUTH）
        auth: true
        # 账号类：锁定/解锁/创建等（ACCOUNT）
        account: true
        # 凭证类：改密/重置等（CREDENTIAL）
        credential: true
        # 访问防护类：网关封禁/限流违规等（ACCESS）；通常仅网关产生
        access: true
      # 过期事件物理删除策略（canonical security_event）
      retention:
        # 是否启用定时清理任务
        enabled: true
        # 保留天数；0=永久保留
        days: 30
        # 单批 DELETE 条数，避免长事务与大锁
        batchSize: 500
        # 单次定时任务最多连续执行的批次数
        maxRounds: 100
    # 永久锁 Redis 信号 TTL（天）；锁定 transition afterCommit 双写 uid/name key
    account-lock-signal:
      permanent-lock-ttl-days: 30
    account:
      # local 或 remote
      mode: local
      lockout:
        # 是否启用自动锁定账号
        enabled: ${ACCOUNT_LOCKOUT_ENABLED:true}
        # 失败次数阈值
        maxAttempts: 5
        # 锁定时长（分钟），0=永久锁定
        lockDurationMinutes: 30
        # 失败计数窗口期（分钟）
        attemptWindowMinutes: 15
        # 从第几次失败开始给出"还剩几次将锁定"的详细提示， 之前的失败一律返回通用"账号或密码错误"，避免暴露用户存在性。
        # 例：maxAttempts=5，hintAfterAttempts=3 时：
        # 第 1/2 次：通用提示
        # 第 3 次：剩余 2 次
        # 第 4 次：剩余 1 次
        # 第 5 次：触发自动锁定，下次登录命中锁定分支
        hintAfterAttempts: 3
  oss:
    minio:
      url: ${MINIO_URL:http://ingot-cloud:9090}
      accessKey: ${MINIO_ACCESS_KEY:2NPpKzxFQjyeMTQFEXA1}
      secretKey: ${MINIO_SECRET_KEY:8SGAp7DhqZCQrYnU9Poyu888pQOB6w4SP2ILHbVU}
  social:
    wechat:
      miniProgramAppId: wx18dc0ea8c6ca1d7d
  # MyBatis SQL日志配置
  mybatis:
    show-sql-log: ${MYBATIS_SHOW_SQL:true}  # 生产环境关闭

# SpringDoc/Swagger配置（测试环境开启）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha

# ==================== 日志配置 ====================
logs:
  path: ${LOG_PATH:/ingot-data/logs}
  mybatisMapper: com.ingot.cloud.pms.mapper

# 日志级别配置
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.cloud: DEBUG
    com.alibaba.nacos.client: INFO
    com.alibaba.cloud: INFO
    com.ingot: DEBUG
  logback:
    rollingpolicy:
      max-file-size: ${LOG_FILE_MAX_SIZE:100MB}
      max-history: ${LOG_FILE_MAX_HISTORY:30}
      total-size-cap: ${LOG_FILE_TOTAL_SIZE:20GB}
