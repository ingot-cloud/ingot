spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: openapi
              uri: lb://in-service-gateway
              predicates:
                - Path=/v3/api-docs/**
              filters:
                - RewritePath=/v3/api-docs/(?<path>.*), /$\{path}/$\{path}/v3/api-docs
            - id: in-service-pms
              uri: lb://in-service-pms
              predicates:
                - Path=/pms/**
              filters:
                - StripPrefix=1
            - id: in-service-member
              uri: lb://in-service-member
              predicates:
                - Path=/member/**
              filters:
                - StripPrefix=1
            - id: in-service-security
              uri: lb://in-service-security
              predicates:
                - Path=/security/**
              filters:
                - StripPrefix=1
            - id: in-crypto-pubkey
              uri: lb://in-service-bff
              predicates:
                - Path=/crypto/public-keys
            - id: in-service-bff
              uri: lb://in-service-bff
              predicates:
                - Path=/bff/**
            - id: in-service-auth
              uri: lb://in-service-auth
              predicates:
                - Path=/auth/client/**
              filters:
                - StripPrefix=1

ingot:
  security:
    # 账号锁定 Gateway Filter：JWT uid key 命中返回 403；Redis 不可用 fail-open
    account-lock-gateway:
      enabled: true
      exclude-path-patterns:
        - /actuator/**
        - /bff/auth/**
    policy:
      client:
        invalidation-enabled: true
        resilience-enabled: true
        local-floor-enabled: true
    ratelimit:
      enabled: true
      policy:
        mode: remote
    blacklist:
      enabled: true
      policy:
        mode: remote
    violation-escalation:
      enabled: true
      policy:
        mode: remote
    event:
      # 安全事件总开关；false 时不做任何上报
      enabled: true
      # center：ACCESS 事件 Feign 上报安全中心，不写网关本地库
      target: center
      shadow-targets: []
      # 写入 security_event.source_module
      sourceModule: GATEWAY
      categories:
        access: true
      retention:
        enabled: false
  vc:
    verifyUrls:
      # 登录入口统一在 BFF；/auth/oauth2/** 不经网关暴露，无需校验验证码
      - image,/bff/auth/login,POST
    image:
      opsLimitGetPerMinute: 20
      opsLimitCheckPerMinute: 40

# SpringDoc/Swagger配置（开发环境开启）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha

# ==================== 日志配置 ====================
logs:
  path: ${LOG_PATH:/ingot-data/logs}

# 开发环境日志级别配置
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.cloud: DEBUG
    com.alibaba.nacos.client: INFO
    com.alibaba.cloud: INFO
    com.ingot: DEBUG
  logback:
    rollingpolicy:
      max-file-size: ${LOG_FILE_MAX_SIZE:100MB}
      max-history: ${LOG_FILE_MAX_HISTORY:30}
      total-size-cap: ${LOG_FILE_TOTAL_SIZE:20GB}